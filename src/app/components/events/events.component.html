<div class="events-container">
  <h2>Upcoming Events</h2>

  <div class="search-bar">
    <input type="text" placeholder="Search events by title, location, or description..." (input)="onSearch($event)">
  </div>

  <ng-container *ngIf="events$ | async as events">
    <div *ngIf="events.length > 0; else noEvents">
      <div *ngFor="let event of events" class="event-card">
        <div class="event-date">
          <span class="month">{{ event.date | date: 'MMM' }}</span>
          <span class="day">{{ event.date | date: 'd' }}</span>
        </div>
        <div class="event-details">
          <h3>{{ event.title }}</h3>
          <p class="location">{{ event.location }}</p>
          <p class="description">{{ event.description }}</p>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #noEvents>
    <p class="no-results">No upcoming events found matching your search criteria.</p>
  </ng-template>
</div>
