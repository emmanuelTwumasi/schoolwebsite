<div class="events-admin-container">
  <h3>Manage Events</h3>

  <div class="event-form-section">
    <h4>{{ isEditing ? 'Edit Event' : 'Add New Event' }}</h4>
    <form (ngSubmit)="saveEvent()">
      <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" [(ngModel)]="newEvent.title" name="title" required>
      </div>
      <div class="form-group">
        <label for="date">Date & Time:</label>
        <input type="datetime-local" id="date" [(ngModel)]="newEvent.date" name="date" required>
      </div>
      <div class="form-group">
        <label for="location">Location:</label>
        <input type="text" id="location" [(ngModel)]="newEvent.location" name="location" required>
      </div>
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" [(ngModel)]="newEvent.description" name="description" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="save-button">{{ isEditing ? 'Update Event' : 'Add Event' }}</button>
        <button type="button" class="cancel-button" *ngIf="isEditing" (click)="resetForm()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="event-list-section">
    <h4>Existing Events</h4>
    <ng-container *ngIf="events$ | async as events">
      <div *ngIf="events.length > 0; else noEvents" class="event-table-container">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Date</th>
              <th>Location</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let event of events">
              <td>{{ event.title }}</td>
              <td>{{ event.date | date: 'short' }}</td>
              <td>{{ event.location }}</td>
              <td>
                <button class="action-button edit-button" (click)="editEvent(event)">Edit</button>
                <button class="action-button delete-button" (click)="deleteEvent(event.id)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>
    <ng-template #noEvents>
      <p class="no-items-message">No events found.</p>
    </ng-template>
  </div>
</div>
