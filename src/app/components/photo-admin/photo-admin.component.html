<div class="photo-admin-container">
  <h3>Manage Photo Albums</h3>

  <div class="album-form-section">
    <h4>{{ isEditing ? 'Edit Album' : 'Add New Album' }}</h4>
    <form (ngSubmit)="saveAlbum()">
      <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" [(ngModel)]="newAlbum.title" name="title" required>
      </div>
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" [(ngModel)]="newAlbum.description" name="description" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="coverPhotoUrl">Cover Photo URL:</label>
        <input type="text" id="coverPhotoUrl" [(ngModel)]="newAlbum.coverPhotoUrl" name="coverPhotoUrl" placeholder="e.g., assets/galleries/my-album-cover.jpg">
      </div>
      <div class="form-actions">
        <button type="submit" class="save-button">{{ isEditing ? 'Update Album' : 'Add Album' }}</button>
        <button type="button" class="cancel-button" *ngIf="isEditing" (click)="resetForm()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="album-list-section">
    <h4>Existing Albums</h4>
    <ng-container *ngIf="photoAlbums$ | async as photoAlbums">
      <div *ngIf="photoAlbums.length > 0; else noAlbums" class="album-table-container">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let album of photoAlbums">
              <td>{{ album.title }}</td>
              <td>{{ album.description }}</td>
              <td>
                <button class="action-button edit-button" (click)="editAlbum(album)">Edit</button>
                <button class="action-button delete-button" (click)="deleteAlbum(album.id)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>
    <ng-template #noAlbums>
      <p class="no-items-message">No photo albums found.</p>
    </ng-template>
  </div>
</div>
