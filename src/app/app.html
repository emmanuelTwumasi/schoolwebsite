<app-loader></app-loader>

<div *ngIf="theme$ | async as theme" [style.--primary-color]="theme.colorPrimary" [style.--secondary-color]="theme.colorSecondary">
  <header>
    <img [src]="theme.logoUrl" alt="School Logo" class="logo">
    <h1>Welcome to the Alumni Network</h1>
    <nav>
      <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/news" routerLinkActive="active">News</a>
        <a routerLink="/directory" routerLinkActive="active">Alumni Directory</a>
        <a routerLink="/events" routerLinkActive="active">Events</a>
        <a routerLink="/gallery" routerLinkActive="active">Photo Galleries</a>
        <a routerLink="/forum" routerLinkActive="active">Discussion Forum</a>
        <a routerLink="/profile" routerLinkActive="active">My Profile</a>
        <a *ngIf="isAdmin()" routerLink="/admin" routerLinkActive="active">Admin Dashboard</a>
        <span class="user-info">Welcome, {{ user.username }}!</span>
        <button (click)="logout()" class="logout-button">Logout</button>
      </ng-container>
      <ng-template #guestLinks>
        <a routerLink="/news" routerLinkActive="active">News</a>
        <a routerLink="/directory" routerLinkActive="active">Alumni Directory</a>
        <a routerLink="/events" routerLinkActive="active">Events</a>
        <a routerLink="/gallery" routerLinkActive="active">Photo Galleries</a>
        <a routerLink="/forum" routerLinkActive="active">Discussion Forum</a>
        <a routerLink="/login" routerLinkActive="active">Login</a>
        <a routerLink="/register" routerLinkActive="active">Register</a>
      </ng-template>
    </nav>
  </header>

  <main>
    <div class="banner" *ngIf="theme.bannerImageUrl" [style.background-image]="'url(' + theme.bannerImageUrl + ')'">
    </div>

    <router-outlet></router-outlet>
  </main>

  <footer>
    <p>&copy; 2024 AlumniConnect. All Rights Reserved.</p>
  </footer>
</div>
