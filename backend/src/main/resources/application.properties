# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/alumniconnect_db
spring.datasource.username=your_db_user
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update # In development, 'update' is fine. For production, use 'validate' with Flyway or Liquibase.
spring.jpa.show-sql=true # Show SQL queries in the console
spring.jpa.properties.hibernate.format_sql=true # Format the SQL for better readability
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# JWT Secret Key (use a long, random, and secure key in a real application, stored securely)
jwt.secret=your-super-secret-key-that-is-long-and-secure
jwt.expiration-ms=86400000 # 24 hours
