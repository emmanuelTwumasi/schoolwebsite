# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/alumniconnect_db?createDatabaseIfNotExist=true
spring.datasource.username=your_mysql_user
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# JWT Secret Key (Base64 encoded for better security)
# Use a secure, randomly generated key in production, stored in environment variables.
# This is a placeholder: echo "your-super-secret-key-that-is-long-and-secure" | base64
jwt.secret=eW91ci1zdXBlci1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1hbmQtc2VjdXJl
jwt.expiration-ms=86400000 # 24 hours
