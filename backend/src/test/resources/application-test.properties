# H2 In-Memory Database Configuration for Tests
# The DATABASE_TO_UPPER=FALSE flag is crucial to prevent H2 from converting table names to uppercase,
# which ensures compatibility with the lowercase table names defined in the JPA entities.
spring.datasource.url=jdbc:h2:mem:testdb;DATABASE_TO_UPPER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Use 'create-drop' to have a clean database for each test run
spring.jpa.hibernate.ddl-auto=create-drop

# Disable showing SQL in tests for cleaner test logs
spring.jpa.show-sql=false
