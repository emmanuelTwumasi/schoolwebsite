# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Use 'create-drop' to have a clean database for each test run
spring.jpa.hibernate.ddl-auto=create-drop

# This is the key fix: Force Hibernate to quote all table and column names.
# This makes the names case-sensitive and prevents H2 from uppercasing them.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable showing SQL in tests for cleaner test logs
spring.jpa.show-sql=false
