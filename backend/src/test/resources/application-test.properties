# H2 In-Memory Database Configuration for Tests
# The MODE=MySQL flag is the key fix. It tells H2 to behave like a MySQL database,
# which resolves naming strategy and SQL grammar conflicts.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Use 'create-drop' to have a clean database for each test run
spring.jpa.hibernate.ddl-auto=create-drop

# Disable showing SQL in tests for cleaner test logs
spring.jpa.show-sql=false
